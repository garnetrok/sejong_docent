if(q.multi){const ok=(answers[q.id]||[]).length>0;const next=btn('다음','primary',()=>{step++;render()});next.disabled=!ok;view.append(next);if(!ok)view.append(el('p','center','하나 이상 골라야 다음으로 갈 수 있어요.'))}}
function renderStars(q){
  const panel=el('div','stars-panel'), row=el('div','star-options');
  const star='<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3.8 25.1 14.4 36.8 16.1 28.3 24.4 30.3 36.1 20 30.6 9.7 36.1 11.7 24.4 3.2 16.1 14.9 14.4Z" stroke-linejoin="round"/></svg>';
  for(const [score,label] of q.o){
    const selected=answers[q.id]===score;
    const b=btn('',`star-option${selected?' selected':''}${typeof answers[q.id]==='number'&&score<=answers[q.id]?' lit':''}`,()=>{if(busy)return;answers[q.id]=score;step++;render()});
    b.setAttribute('aria-label',score+'점 '+label);b.setAttribute('aria-pressed',String(selected));
    b.innerHTML=star;b.append(el('span','',score+'점'));row.append(b);
  }
  const ends=el('div','star-endpoints');ends.append(el('span','','아주 만족'),el('span','','매우 불만족'));
  panel.append(row,ends);view.append(el('p','hint','별을 눌러 점수를 골라 주세요.'),panel);
}
$('back').onclick=()=>{if(!busy){step--;render()}};
function finishScreen(){
  view.append(scene('마지막 단계'),el('h2','','모든 질문에 답했어요!'),el('p','','아래 버튼을 눌러 응답을 제출해 주세요.'));
  view.append(btn('응답 제출하기','primary',submit),btn('이전 답변 확인','secondary',()=>{step--;render()}));
}
// Match the V5 SQL column names and send null for skipped questions.
function buildRow(){
  pruneAnswers();
  const row={client_id:requestId,survey_version:SURVEY_VERSION};
  Q.forEach(q=>{row[q.id]=Object.prototype.hasOwnProperty.call(answers,q.id)?answers[q.id]:null});
  for(const q of active()){if(row[q.id]===null||(q.multi&&!row[q.id].length))throw new Error('Missing answer: '+q.id)}
  return row;
}
async function postRow(row){
  const ctrl=new AbortController();
  const timeout=setTimeout(()=>ctrl.abort(),12000);
  try{
    const response=await fetch(SUPABASE_URL+'/rest/v1/'+TABLE,{
      method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
      body:JSON.stringify(row),signal:ctrl.signal
    });
    if(response.ok)return;
    let detail={};
    try{detail=await response.json()}catch(e){}
    // An identical client_id retried after an uncertain response may already be stored.
    if(response.status===409&&detail.code==='23505')return;
    const err=new Error('Supabase HTTP '+response.status+' '+(detail.message||''));
    err.http=response.status;
    throw err;
  }finally{clearTimeout(timeout)}
}
let submittedRow=null;
async function submit(){
  if(busy)return;
  busy=true;
  const buttons=view.querySelectorAll('button');
  buttons.forEach(b=>b.disabled=true);
  let status=document.getElementById('saveStatus');
  if(!status){status=el('p','','');status.id='saveStatus';status.setAttribute('role','status');view.append(status)}
  status.className='';status.textContent='응답 저장 중…';
  // Preserve the exact payload and ID for network retries, avoiding accidental duplicate submissions.
  try{if(!submittedRow)submittedRow=buildRow();await postRow(submittedRow);done(true)}
  catch(e){
    busy=false;console.warn('Survey save failed:',e.message);
    status.className='error';
    status.textContent='저장 확인에 실패했어요. 인터넷 연결을 확인하고 다시 제출해 주세요.';
    if(e.http>=400&&e.http<500){submittedRow=null;buttons.forEach(b=>b.disabled=false)}
    else{buttons[0].disabled=false;buttons[1].disabled=true;status.textContent+=' 중복 저장을 막기 위해 같은 응답을 다시 전송합니다.'}
  }
}
function done(saved){busy=false;snow(false);view.replaceChildren();$('header').hidden=true;view.append(scene('메리 크리스마스!'),el('h1','center','소중한 응답, 고마워요!'),el('p','center',saved?'응답이 저장되었습니다. 즐거운 축제 보내세요!':'미리보기 완료! 실제 응답은 저장되지 않았습니다.'),btn('처음으로','primary',reset))}
reset();
</script></body></html>
