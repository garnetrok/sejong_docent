function garland(total,completed){let content='<path d="M9 7 Q180 19 351 7" fill="none" stroke="#91ac9750" stroke-width="1.6"/>';for(let i=0;i<total;i++){const x=12+i*336/Math.max(1,total-1),y=7+5*Math.sin(i/Math.max(1,total-1)*Math.PI);const on=i<completed,c=palette[i%4];content+=`<g><rect x="${x-2.3}" y="${y-1}" width="4.6" height="5" rx="1" fill="#082b2a"/>${on?`<circle cx="${x}" cy="${y+10}" r="9" fill="${c}" opacity=".13"/>`:''}<path d="M${x-3.8} ${y+5}Q${x-5.2} ${y+11} ${x} ${y+15}Q${x+5.2} ${y+11} ${x+3.8} ${y+5}Z" fill="${on?c:'#3d6256'}"/>${on?`<circle cx="${x-1}" cy="${y+8}" r="1.1" fill="#fff4d3"/>`:''}</g>`}const g=$('progress');g.innerHTML=`<svg viewBox="0 0 360 28" aria-hidden="true">${content}</svg>`;g.setAttribute('aria-valuenow',Math.round(completed/Math.max(1,total)*100));}

function reset(){submittedRow=null;answers={};step=-1;busy=false;requestId=(window.crypto&&typeof window.crypto.randomUUID==='function'?window.crypto.randomUUID():null)||Date.now()+'-'+Math.random().toString(36).slice(2);render()}
function pruneAnswers(){const j=joined();
if(answers.docent_participated!==true)Q.filter(x=>x.docent).forEach(x=>delete answers[x.id]);
Q.filter(x=>x.program&&!j.includes(x.program)).forEach(x=>delete answers[x.id]);
if(!j.length)Q.filter(x=>x.any).forEach(x=>delete answers[x.id]);
if(j.length===1)answers.favorite=j[0];else if(!j.includes(answers.favorite))delete answers.favorite;
}
function render(){
view.replaceChildren();view.className='screen';$('header').hidden=step<0||step>=active().length;window.scrollTo(0,0);

const list=active(),q=list[step],total=list.length;

const estimatedTotal=totalKnown?total:(answers.docent_participated===false?11:17);

else{a.delete('none');a.has(value)?a.delete(value):a.add(value)}

else{answers[q.id]=value;pruneAnswers();step++;render()}});
b.setAttribute('aria-pressed',String(selected));
const mark=el('span',q.scale?`num score-${value}`:`mark${q.multi?' box':''}`,q.scale?`${value}점`:'');
if(!q.scale)mark.innerHTML=CHECK;
b.append(mark);if(value!=='none'&&(q.id==='programs'||q.id==='favorite')&&miniArt(value)){const art=el('span','mini-art');art.innerHTML=miniArt(value);b.classList.add('program-choice');b.append(art)}b.append(el('span','label',label));options.append(b)}

function renderStars(q){

// Match the V5 SQL column names and send null for skipped questions.
function buildRow(){
  pruneAnswers();
  const row={client_id:requestId,survey_version:SURVEY_VERSION};
  Q.forEach(q=>{row[q.id]=Object.prototype.hasOwnProperty.call(answers,q.id)?answers[q.id]:null});
  for(const q of active()){if(row[q.id]===null||(q.multi&&!row[q.id].length))throw new Error('Missing answer: '+q.id)}
  return row;
}
async function postRow(row){
  const ctrl=new AbortController();
  const timeout=setTimeout(()=>ctrl.abort(),12000);
  try{
    const response=await fetch(SUPABASE_URL+'/rest/v1/'+TABLE,{
      method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
      body:JSON.stringify(row),signal:ctrl.signal
    });
    if(response.ok)return;
    let detail={};
    try{detail=await response.json()}catch(e){}
    // An identical client_id retried after an uncertain response may already be stored.
    if(response.status===409&&detail.code==='23505')return;
    const err=new Error('Supabase HTTP '+response.status+' '+(detail.message||''));
    err.http=response.status;
    throw err;
  }finally{clearTimeout(timeout)}
}
let submittedRow=null;
async function submit(){
  if(busy)return;
  busy=true;
  const buttons=view.querySelectorAll('button');
  buttons.forEach(b=>b.disabled=true);
  let status=document.getElementById('saveStatus');
  if(!status){status=el('p','','');status.id='saveStatus';status.setAttribute('role','status');view.append(status)}
  status.className='dim';status.textContent='응답 저장 중…';
  // Preserve the exact payload and ID for network retries, avoiding accidental duplicate submissions.
  try{if(!submittedRow)submittedRow=buildRow();await postRow(submittedRow);done(true)}
  catch(e){
    busy=false;console.warn('Survey save failed:',e.message);
    status.className='error';
    status.textContent=e.http>=400&&e.http<500?'서버에서 응답을 저장하지 못했어요. 운영자에게 알려 주세요. ('+e.message+')':'저장 확인에 실패했어요. 인터넷 연결을 확인하고 다시 제출해 주세요.';
    if(e.http>=400&&e.http<500){submittedRow=null;buttons.forEach(b=>b.disabled=false)}
    else{buttons[0].disabled=false;buttons[1].disabled=true;status.textContent+=' 중복 저장을 막기 위해 같은 응답을 다시 전송합니다.'}
  }
}
function done(saved){busy=false;view.replaceChildren();view.className='screen ending';$('header').hidden=true;$('village').replaceChildren();const st=el('div','endcard');st.append(world(1,true,false,true),el('div','endmark','메리 크리스마스'),el('h1','','산타와 루돌프가 찾아왔어요!'),el('p','','여러분 덕분에 크리스마스 마을이 환하게 빛나요. '+(saved?'응답이 저장되었습니다.':'미리보기 완료. 실제 응답은 저장되지 않았습니다.')),el('p','','소중한 이야기를 들려줘서 고마워요.'));view.append(st,btn('처음으로','primary',reset));}
