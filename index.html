<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 금강수목원 숲속문화제 체험부스 만족도 조사</title>
<meta name="description" content="세종청년도슨트 체험부스 만족도 조사 · 딱 2분!">
<meta property="og:title" content="오늘 숲속에서 어떠셨나요? 🌿">
<meta property="og:description" content="2026 금강수목원 숲속문화제 체험부스 만족도 조사 · 딱 2분!">
<meta name="theme-color" content="#F7F3EA">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root{
    --bg:#F7F3EA; --card:#FFFDF8; --ink:#24352A; --sub:#5F6B61; --line:#E4DCCB;
    --green:#3E7B4F; --green-ink:#2F6440; --green-soft:#E3EEDC; --warm:#D99A3D; --warm-soft:#F6E6C4; --bark:#6E4B30;
    --display:"Jua","Pretendard",sans-serif;
    --pop:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:var(--bg); color:var(--ink); -webkit-tap-highlight-color:transparent;
    word-break:keep-all; line-height:1.5; caret-color:var(--green);
  }
  ::selection{background:#CFE0C3;color:var(--ink)}
  :focus-visible{outline:3px solid var(--warm);outline-offset:3px;border-radius:12px}
  .app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 20px)}

  /* top: 숲길 진행 표시 */
  .top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
  .top.hide{display:none}
  .back{display:flex;align-items:center;gap:2px;border:0;background:none;font:inherit;color:var(--sub);
    font-size:15px;font-weight:600;min-height:44px;padding:0 6px 0 0;cursor:pointer;visibility:hidden}
  .back svg{width:20px;height:20px}
  .back.show{visibility:visible}
  .trail{order:3;flex:0 0 100%;margin-top:2px}
  .trail svg{display:block;width:100%;height:auto;overflow:visible}
  .count{font-family:var(--display);font-size:17px;color:var(--green-ink);min-width:44px;text-align:right;
    font-variant-numeric:tabular-nums}
  .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s var(--pop) both}
  @keyframes grow{from{transform:scale(0)}}
  .bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:scale(1.15) rotate(4deg)}}

  /* screens */
  .screen{flex:1;display:flex;flex-direction:column;animation:in .45s var(--out) both}
  .screen.out{animation:out .18s ease both}
  .screen.rev{animation-name:inrev}
  @keyframes in{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
  @keyframes inrev{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
  @keyframes out{to{opacity:0;transform:translateX(-28px)}}

  h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.22;letter-spacing:-.01em;text-wrap:balance}
  h2{font-family:var(--display);font-weight:400;font-size:25px;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
  .sub{color:var(--sub);font-size:15.5px;margin-top:6px}
  .lead{font-size:16.5px;margin-top:14px;max-width:34em}
  .lead+.lead{margin-top:8px}

  /* 질문 위 장면 */
  .stage{display:flex;justify-content:center;align-items:flex-end;border-radius:24px;padding:12px 12px 4px;margin-bottom:16px;background:var(--green-soft)}
  .stage svg{width:100%;max-width:200px;height:auto}
  .stage.t1{background:var(--warm-soft)} .stage.t2{background:#DDEBE4} .stage.t3{background:#F2E2D2}

  /* 그림 버튼: 타일(2열) */
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
  .opts.list{grid-template-columns:1fr}
  .opts>:last-child:nth-child(odd):not(.row){grid-column:1/-1}
  .tile,.row,.card{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;
    font:inherit;color:var(--ink);cursor:pointer;
    transition:border-color .15s,background-color .15s,transform .25s var(--pop)}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;
    min-height:128px;padding:10px 8px 14px;font-size:17.5px;font-weight:700;line-height:1.3;text-align:center}
  .tile svg{width:88px;height:auto}
  .row{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:8px 16px 8px 8px;
    font-size:17px;font-weight:600;text-align:left}
  .row svg{width:54px;height:auto;flex:none}
  .tile svg,.row svg,.card svg{transition:transform .3s var(--pop)}
  .tile:active,.row:active,.card:active{transform:scale(.96)}
  @media (hover:hover){
    .tile:hover,.row:hover,.card:hover{border-color:#B9CDB0;transform:translateY(-2px)}
    .tile:hover svg,.row:hover svg{transform:rotate(-4deg) scale(1.06)}
  }
  .on{border-color:var(--green);background:var(--green-soft)}
  .on>svg{animation:pop .5s var(--pop)}
  @keyframes pop{40%{transform:scale(1.22) rotate(-6deg)}}

  /* 나뭇잎 팡! */
  .burst{position:absolute;width:0;height:0;pointer-events:none;z-index:2}
  .burst i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:0 100% 0 100%;
    animation:leaf .75s var(--out) forwards}
  @keyframes leaf{from{transform:translate(0,0) scale(.3);opacity:1}
    to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}

  /* 체험부스 카드 */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .card{display:flex;flex-direction:column;padding:10px 10px 12px;text-align:left}
  .card svg{width:100%;height:auto;border-radius:12px}
  .card b{font-size:15px;line-height:1.35;margin-top:8px;font-weight:700}
  .card small{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.35}
  .card .tick{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;
    background:#fff;border:2px solid var(--line);display:grid;place-items:center;transition:transform .3s var(--pop)}
  .card .tick svg{width:16px;border-radius:0;opacity:0}
  .card.on .tick{background:var(--green);border-color:var(--green);transform:scale(1.1)}
  .card.on .tick svg{opacity:1}
  .card.on>svg{animation:none}
  .card:last-child:nth-child(odd){grid-column:1/-1}
  .card:last-child:nth-child(odd)>svg{max-width:58%;align-self:center}

  /* 아래 버튼 */
  .spacer{flex:1;min-height:20px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:18px;
    background:var(--green);color:#fff;font:inherit;font-size:18px;font-weight:700;cursor:pointer;margin-top:20px;
    box-shadow:0 6px 16px -6px rgba(47,100,64,.55);transition:transform .25s var(--pop),opacity .15s}
  .btn svg{width:20px;height:20px;transition:transform .25s var(--pop)}
  .btn:active{transform:scale(.97)}
  @media (hover:hover){.btn:not(:disabled):hover svg{transform:translateX(4px)}}
  .btn:disabled{opacity:.35;cursor:default;box-shadow:none}
  .btn.ghost{background:none;color:var(--sub);font-weight:600;margin-top:6px;min-height:48px;box-shadow:none}

  /* 마지막 한마디: 편지지 */
  textarea{width:100%;min-height:162px;margin-top:18px;padding:14px 16px;border:2px solid var(--line);border-radius:18px;
    font:inherit;font-size:16.5px;line-height:32px;color:var(--ink);resize:vertical;
    background:var(--card) repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px) 0 14px/100% 32px local}
  textarea::placeholder{color:#7A857C}
  textarea:focus{outline:none;border-color:var(--green)}
  .hint{font-size:13px;color:var(--sub);text-align:right;margin-top:6px;font-variant-numeric:tabular-nums}

  /* 시작 화면 */
  .hero{position:relative;overflow:hidden;margin:0 -8px 22px;padding-top:28px;border-radius:28px;background:var(--green-soft)}
  .hero>svg{display:block;width:100%;height:auto}
  .fall{position:absolute;top:-16px;width:14px;height:14px;border-radius:0 100% 0 100%;animation:fall linear infinite}
  @keyframes fall{from{transform:translate(0,0) rotate(0)}to{transform:translate(-40px,260px) rotate(540deg)}}
  .meta{align-self:flex-start;margin-top:12px;background:var(--warm-soft);color:var(--bark);font-size:13.5px;font-weight:700;
    padding:5px 12px;border-radius:99px}

  /* 끝 화면 */
  .forest{margin:0 -8px 20px}
  .forest svg{display:block;width:100%;height:auto;overflow:visible}
  .float{transform-box:fill-box;transform-origin:50% 50%;animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px) scale(1.04)}}
  .sign{margin-top:18px;font-family:var(--display);font-size:19px;color:var(--green-ink)}
  .note{font-size:12.5px;color:var(--sub);text-align:center;margin-top:10px}
  .center{text-align:center}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .fall{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <div class="top hide" id="top">
    <button class="back" id="back" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>이전</button>
    <div class="trail" id="trail"></div>
    <div class="count" id="count"></div>
  </div>
  <main id="view"></main>
</div>

<script>
/* ===================== 설정 =====================
   Supabase 대시보드 > Project Settings > API 에서 복사해 넣으세요.
   anon(public) 키 또는 publishable 키만 넣으세요. service_role/secret 키는 절대 넣지 마세요. */
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_KEY = "YOUR-ANON-OR-PUBLISHABLE-KEY";
const TABLE = "survey_responses";
/* ================================================ */

/* ---------- 일러스트 (SVG) ---------- */
const C = {g1:"#3E7B4F", g2:"#6FA05A", g3:"#9CC07F", g4:"#CFE0C3", g5:"#E3EEDC",
  w1:"#D99A3D", w2:"#E6B85C", w3:"#F2D7A0", b1:"#8A6142", b2:"#B8742F", cream:"#FFFDF8", ink:"#24352A"};
const leaf = (x,y,r,s,c) => `<path d="M0 -8C5 -4 5 4 0 8C-5 4 -5 -4 0 -8Z" transform="translate(${x} ${y}) rotate(${r}) scale(${s})" fill="${c}"/>`;
const pine = (x,y,s,c=C.g1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-3" y="-4" width="6" height="12" fill="${C.b1}"/><path d="M0 -50L16 -22H8L20 -2H-20L-8 -22H-16Z" fill="${c}"/></g>`;
const tree = (x,y,s,c=C.g2) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-3.5" y="-16" width="7" height="20" rx="2" fill="${C.b1}"/><circle cx="0" cy="-30" r="20" fill="${c}"/></g>`;
const svg = (vb, body, bg) => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${bg?`<rect width="100%" height="100%" fill="${bg}"/>`:""}${body}</svg>`;

const ART = {
  hero: () => svg("0 0 360 200", `
    <circle cx="292" cy="54" r="26" fill="${C.w3}"/>
    <path d="M0 140Q90 88 180 126T360 112V200H0Z" fill="${C.g4}"/>
    ${pine(60,128,1.05)}${tree(104,132,1.1,C.w1)}${pine(250,118,.9,C.g2)}${tree(300,124,1.15)}
    <path d="M0 168Q120 132 220 160T360 150V200H0Z" fill="${C.g3}"/>
    ${tree(160,166,1.35)}${pine(210,164,1.1)}${tree(32,176,.9,C.w2)}${pine(330,170,.95)}
    ${leaf(130,40,30,1.4,C.w1)}${leaf(186,70,-20,1.2,C.b2)}${leaf(232,34,60,1.1,C.w2)}${leaf(82,72,-50,1.1,C.w2)}`),

  sprout: () => svg("0 0 240 130", `
    <ellipse cx="120" cy="112" rx="80" ry="14" fill="${C.g4}"/>
    <ellipse cx="120" cy="108" rx="46" ry="10" fill="${C.b1}" opacity=".85"/>
    <path d="M120 106V62" stroke="${C.g1}" stroke-width="6" stroke-linecap="round"/>
    <path d="M120 72C98 72 84 58 82 38C104 38 118 50 120 72Z" fill="${C.g2}"/>
    <path d="M120 64C138 62 154 48 158 26C136 26 122 40 120 64Z" fill="${C.g3}"/>
    ${leaf(58,40,-30,1,C.w2)}${leaf(184,70,40,1,C.w1)}`),

  feet: () => {
    const face = (x,y,s) => `<g transform="translate(${x} ${y}) scale(${s})"><circle cx="-6" cy="0" r="2.4" fill="${C.ink}"/><circle cx="6" cy="0" r="2.4" fill="${C.ink}"/><path d="M-5 6Q0 10 5 6" stroke="${C.ink}" stroke-width="2" fill="none" stroke-linecap="round"/></g>`;
    return svg("0 0 240 130", `
      <ellipse cx="120" cy="118" rx="96" ry="10" fill="${C.g4}"/>
      ${tree(78,118,1.75,C.g2)}${face(78,66,1.3)}
      ${tree(134,118,1.3,C.w1)}${face(134,80,1.1)}
      ${tree(176,118,.95,C.g3)}${face(176,90,.9)}
      ${leaf(40,40,-30,1.2,C.w2)}${leaf(196,40,40,1.1,C.w1)}${leaf(120,26,70,1,C.g3)}`);
  },

  heart: () => svg("0 0 240 130", `
    <ellipse cx="120" cy="120" rx="70" ry="8" fill="${C.g4}"/>
    <rect x="114" y="78" width="12" height="42" rx="4" fill="${C.b1}"/>
    <path d="M120 96C92 76 70 58 70 38C70 22 82 12 96 12C107 12 116 18 120 28C124 18 133 12 144 12C158 12 170 22 170 38C170 58 148 76 120 96Z" fill="${C.g2}"/>
    <path d="M120 30V80M120 50L104 38M120 62L138 48" stroke="${C.g1}" stroke-width="3" stroke-linecap="round" fill="none"/>
    ${leaf(52,70,-30,1.2,C.w1)}${leaf(190,60,30,1.2,C.w2)}${leaf(196,100,70,1,C.b2)}`),

  magnify: () => svg("0 0 240 130", `
    <ellipse cx="110" cy="118" rx="76" ry="8" fill="${C.g4}"/>
    ${tree(82,118,1.6)}${pine(140,118,1.3)}
    <circle cx="150" cy="56" r="30" fill="#fff" fill-opacity=".55" stroke="${C.b1}" stroke-width="7"/>
    <path d="M172 78L196 102" stroke="${C.b1}" stroke-width="11" stroke-linecap="round"/>
    <path d="M138 44Q144 38 152 38" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>
    ${leaf(36,40,-20,1,C.w2)}`),

  hands: () => svg("0 0 240 130", `
    <path d="M120 66V38" stroke="${C.g1}" stroke-width="5" stroke-linecap="round"/>
    <path d="M120 46C104 46 94 36 92 22C108 22 118 32 120 46Z" fill="${C.g2}"/>
    <path d="M120 40C134 40 146 30 148 14C132 14 122 24 120 40Z" fill="${C.g3}"/>
    <ellipse cx="120" cy="70" rx="38" ry="9" fill="${C.b1}"/>
    <path d="M60 72C70 104 98 116 120 116C142 116 170 104 180 72C162 76 140 80 120 80C100 80 78 76 60 72Z" fill="${C.w3}"/>
    <path d="M120 82V116" stroke="${C.w2}" stroke-width="3"/>
    <path d="M60 72C52 70 44 76 46 84C50 100 64 112 80 116" stroke="${C.w2}" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M180 72C188 70 196 76 194 84C190 100 176 112 160 116" stroke="${C.w2}" stroke-width="3" fill="none" stroke-linecap="round"/>
    ${leaf(42,36,-40,1.1,C.w1)}${leaf(198,40,40,1.1,C.g3)}`),

  flag: () => svg("0 0 240 130", `
    <ellipse cx="120" cy="120" rx="80" ry="8" fill="${C.g4}"/>
    <rect x="74" y="18" width="6" height="102" rx="3" fill="${C.b1}"/>
    <path d="M80 22H150L136 44L150 66H80Z" fill="${C.g1}"/>
    ${leaf(110,44,40,1.7,C.w3)}
    <path d="M150 74H206A10 10 0 0 1 216 84V102A10 10 0 0 1 206 112H170L160 122V112H150A10 10 0 0 1 140 102V84A10 10 0 0 1 150 74Z" fill="${C.cream}" stroke="${C.line||'#E4DCCB'}" stroke-width="2"/>
    <circle cx="164" cy="93" r="4" fill="${C.w1}"/><circle cx="178" cy="93" r="4" fill="${C.w1}"/><circle cx="192" cy="93" r="4" fill="${C.w1}"/>
    ${pine(36,118,.8,C.g2)}`),

  bubble: () => svg("0 0 240 130", `
    <path d="M44 20H196A14 14 0 0 1 210 34V84A14 14 0 0 1 196 98H110L88 118V98H44A14 14 0 0 1 30 84V34A14 14 0 0 1 44 20Z" fill="${C.cream}" stroke="#E4DCCB" stroke-width="2"/>
    <circle cx="74" cy="58" r="20" fill="${C.g5}"/>
    ${leaf(74,58,30,1.8,C.g1)}
    <rect x="106" y="42" width="78" height="9" rx="4.5" fill="${C.g3}"/>
    <rect x="106" y="58" width="60" height="9" rx="4.5" fill="#E4DCCB"/>
    <rect x="106" y="74" width="70" height="9" rx="4.5" fill="#E4DCCB"/>`),

  path: () => svg("0 0 240 130", `
    <path d="M0 96Q120 70 240 92V130H0Z" fill="${C.g4}"/>
    ${pine(150,84,1)}${tree(184,86,1.1,C.w1)}${pine(214,88,.9,C.g2)}${tree(120,80,.85)}
    <path d="M40 130Q100 110 146 88H160Q124 108 128 130Z" fill="${C.w3}"/>
    <path d="M86 122L94 118M112 108L118 104M132 98L137 95" stroke="${C.b1}" stroke-width="3" stroke-linecap="round" opacity=".45"/>
    <circle cx="60" cy="36" r="16" fill="${C.w3}"/>
    ${leaf(100,30,20,1.1,C.w1)}${leaf(206,30,-30,1,C.w2)}`),

  letter: () => svg("0 0 240 130", `
    <g transform="rotate(-6 120 70)">
      <rect x="54" y="30" width="132" height="84" rx="10" fill="${C.cream}" stroke="#E4DCCB" stroke-width="2"/>
      <path d="M58 36L120 80L182 36" stroke="#E4DCCB" stroke-width="3" fill="none" stroke-linejoin="round"/>
      <rect x="150" y="40" width="26" height="30" rx="3" fill="${C.g5}" stroke="${C.g3}" stroke-width="2" stroke-dasharray="3 3"/>
      ${leaf(163,55,25,1.3,C.g1)}
    </g>
    <path d="M196 26C190 18 178 22 182 32C184 37 196 44 196 44C196 44 208 37 210 32C214 22 202 18 196 26Z" fill="${C.w1}"/>
    ${leaf(38,90,-30,1.1,C.w2)}`),

  thanks: () => svg("0 0 360 190", `
    <path d="M0 150Q100 112 190 140T360 128V190H0Z" fill="${C.g4}"/>
    ${pine(56,148,1)}${tree(100,150,1.1,C.w1)}${tree(262,144,1.2)}${pine(310,140,1.05,C.g2)}
    <path d="M0 172Q130 150 230 168T360 162V190H0Z" fill="${C.g3}"/>
    <path d="M180 112C150 90 128 72 128 50C128 33 141 22 156 22C167 22 176 28 180 38C184 28 193 22 204 22C219 22 232 33 232 50C232 72 210 90 180 112Z" fill="${C.w1}"/>
    ${leaf(180,64,0,2.2,C.cream)}
    ${leaf(110,44,30,1.3,C.w2)}${leaf(256,58,-40,1.3,C.g2)}${leaf(80,90,-60,1.1,C.b2)}${leaf(290,96,50,1.1,C.w2)}`),

  /* ---- 체험부스 ---- */
  lion: () => {
    let mane = "";
    const cols = [C.w1, C.b2, C.w2, C.b1];
    for (let i = 0; i < 20; i++) { const a = i/20*Math.PI*2; mane += leaf(100+Math.cos(a)*44, 76+Math.sin(a)*42, a*180/Math.PI+90, 2.3, cols[i%4]); }
    for (let i = 0; i < 16; i++) { const a = (i+.5)/16*Math.PI*2; mane += leaf(100+Math.cos(a)*34, 76+Math.sin(a)*32, a*180/Math.PI+90, 1.8, cols[(i+2)%4]); }
    return svg("0 0 200 150", `${mane}
      <circle cx="80" cy="52" r="8" fill="${C.w2}"/><circle cx="120" cy="52" r="8" fill="${C.w2}"/>
      <circle cx="100" cy="78" r="29" fill="${C.w3}"/>
      <circle cx="90" cy="72" r="3.4" fill="${C.ink}"/><circle cx="110" cy="72" r="3.4" fill="${C.ink}"/>

function go(next, reverse=false){
  const old = view.firstElementChild;
  const render = () => { step = next; draw(reverse); window.scrollTo(0,0); busy = false; };
  if (old && !calm()){ old.classList.add("out"); setTimeout(render, 170); }
  else render();
}

// 진행 표시: 지나온 질문마다 나무 한 그루, 지금 질문은 새싹
function trailHTML(reverse){
  const n = QUESTIONS.length;
  let g = `<path d="M0 46Q85 40 170 45T340 44V54H0Z" fill="${C.g4}"/>`;
  for (let i = 0; i < n; i++){
    const x = 14 + i * (312 / (n - 1));
    if (i < step){
      const t = i % 3 === 0 ? pine(x,46,.4,C.g1) : i % 3 === 1 ? tree(x,46,.46,C.g2) : tree(x,46,.4,C.w1);
      g += i === step - 1 && !reverse ? `<g class="grow">${t}</g>` : t;
    } else if (i === step){
      g += `<g class="bob"><g transform="translate(${x} 46)"><path d="M0 0V-9" stroke="${C.g1}" stroke-width="2.4" stroke-linecap="round"/><path d="M0 -6C-5 -6 -8 -9 -8 -13C-3 -13 0 -10 0 -6Z" fill="${C.g2}"/><path d="M0 -8C4 -8 7 -11 7 -15C3 -15 0 -12 0 -8Z" fill="${C.g3}"/></g></g>`;
    } else g += `<circle cx="${x}" cy="46" r="2.6" fill="${C.b1}" opacity=".35"/>`;
  }
  return svg("0 16 340 38", g);
}

function draw(reverse){
  const n = QUESTIONS.length;
  const inQ = step >= 0 && step < n;
  $top.classList.toggle("hide", !inQ);
  $back.classList.toggle("show", step > 0 && inQ);
  if (inQ){ $trail.innerHTML = trailHTML(reverse); $count.textContent = `${step+1} / ${n}`; }
  let html = "";
  if (step < 0) html = startHTML();
  else if (step >= n) html = endHTML();
  else html = questionHTML(QUESTIONS[step]);
  view.innerHTML = `<section class="screen${reverse?" rev":""}">${html}</section>`;
  bind();
}

    <p class="lead">딱 2분! 답을 누르면 바로 다음 질문으로 넘어가요.</p>
    <div class="spacer"></div>
    <button class="btn" data-act="start">시작하기${ARROW}</button>`;
}

function endHTML(){
  return `
    <div class="forest">${forestArt(QUESTIONS.length)}</div>
    <h1 class="center">참여해 주셔서<br>감사합니다! 🌿</h1>
    <p class="lead center">금강수목원에 앞으로도 자주 방문해 주세요!<br>우리 지역의 소중한 이야기를 계속 전하겠습니다.</p>
    <p class="sign center">– 세종청년도슨트</p>
    <div class="spacer"></div>
    ${configured() ? "" : `<p class="note">데모 모드: Supabase 설정 전이라 응답이 저장되지 않았어요.</p>`}
    <button class="btn ghost" data-act="restart">처음으로</button>`;
}

function questionHTML(q){
  const a = answers[q.id];
  let head = `${q.art ? `<div class="stage t${step%4}">${ART[q.art]()}</div>` : ""}
    <h2>${q.title}</h2>${q.sub ? `<p class="sub">${q.sub}</p>` : ""}`;
  if (q.type === "single"){
    const arts = PICK_ART[q.id] || [];
    return head + `<div class="opts">${q.options.map((o,i) =>
      `<button class="tile${a===o?" on":""}" data-v="${esc(o)}" aria-pressed="${a===o}">${arts[i] ? arts[i]() : ""}<span>${esc(o)}</span></button>`).join("")}</div>`;
  }
  if (q.type === "scale"){
    return head + `<div class="opts list">${q.options.map(([v,l,e]) =>
      `<button class="row${a===v?" on":""}" data-v="${v}" aria-pressed="${a===v}">${(e && EMO[e] ? EMO[e] : LEVEL[v])()}<span>${esc(l)}</span></button>`).join("")}</div>`;
  }
  if (q.type === "multi"){
    const sel = a || [];
    return head + `<div class="grid">${q.options.map(o =>
      `<button class="card${sel.includes(o.v)?" on":""}" data-m="${esc(o.v)}" aria-pressed="${sel.includes(o.v)}">
        <span class="tick">${CHECK}</span>${ART[o.art]()}<b>${esc(o.v)}</b><small>${esc(o.d)}</small></button>`).join("")}</div>
      <div class="spacer"></div>
      <button class="btn" data-act="next" ${sel.length?"":"disabled"}>다음${ARROW}</button>`;
  }
  if (q.type === "text"){
    return head + `<textarea id="txt" maxlength="500" placeholder="자유롭게 적어주세요">${esc(a||"")}</textarea>
      <p class="hint"><span id="len">${(a||"").length}</span>/500</p>
      <div class="spacer"></div>
      <button class="btn" data-act="submit">제출하기${ARROW}</button>`;
  }
}

// 고른 자리에서 나뭇잎이 팡 터짐
function burst(el, e){
  if (calm()) return;
  const r = el.getBoundingClientRect();
  const x = e.detail ? e.clientX - r.left : r.width / 2, y = e.detail ? e.clientY - r.top : r.height / 2;
  const cols = [C.g2, C.w1, C.g3, C.w2, C.b2, C.g1, C.w2];
  const s = document.createElement("span");
  s.className = "burst"; s.style.left = x + "px"; s.style.top = y + "px";
  s.innerHTML = cols.map((c,i) => {
    const ang = i / cols.length * Math.PI * 2 + Math.random() * .6, d = 40 + Math.random() * 24;
    return `<i style="--dx:${(Math.cos(ang)*d).toFixed(1)}px;--dy:${(Math.sin(ang)*d - 12).toFixed(1)}px;--r:${Math.round(Math.random()*360)}deg;background:${c}"></i>`;
  }).join("");
  el.appendChild(s);
  setTimeout(() => s.remove(), 800);
}

function bind(){
  const q = QUESTIONS[step];
  view.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", e => {
    if (busy) return; busy = true;
    const v = q.type === "scale" ? Number(b.dataset.v) : b.dataset.v;
    answers[q.id] = v;
    view.querySelectorAll("[data-v]").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b); });
    burst(b, e);
    setTimeout(() => go(step+1), calm() ? 260 : 480);
  }));
  view.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", e => {
    const sel = new Set(answers[q.id] || []);
    sel.has(b.dataset.m) ? sel.delete(b.dataset.m) : sel.add(b.dataset.m);
    answers[q.id] = q.options.map(o => o.v).filter(v => sel.has(v));
    b.classList.toggle("on"); b.setAttribute("aria-pressed", sel.has(b.dataset.m));
    if (sel.has(b.dataset.m)) burst(b, e);
    view.querySelector('[data-act="next"]').disabled = sel.size === 0;
  }));
  const txt = document.getElementById("txt");
  if (txt) txt.addEventListener("input", () => { answers.comment = txt.value; document.getElementById("len").textContent = txt.value.length; });
  view.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
    const act = b.dataset.act;
    if (busy) return;
    if (act === "start") { busy = true; go(0); }
    if (act === "next") { busy = true; go(step+1); }
    if (act === "submit") { busy = true; b.disabled = true; b.textContent = "보내는 중…"; submit().finally(() => go(QUESTIONS.length)); }
    if (act === "restart") { answers = {}; busy = true; go(-1); }
  }));
}

$back.addEventListener("click", () => { if (!busy && step > 0){ busy = true; go(step-1, true); } });

/* ---------- 저장 (Supabase REST) ---------- */
const configured = () => !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_KEY.startsWith("YOUR-");
const QUEUE_KEY = "gk_survey_pending";
const loadQueue = () => { try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]"); } catch(e){ return []; } };
const saveQueue = q => { try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch(e){} };

async function post(row){
  const headers = {"Content-Type":"application/json", "apikey":SUPABASE_KEY, "Prefer":"return=minimal"};
  if (SUPABASE_KEY.startsWith("eyJ")) headers["Authorization"] = "Bearer " + SUPABASE_KEY; // 기존 anon(JWT) 키
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 10000);
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {method:"POST", headers, body:JSON.stringify(row), signal:ctrl.signal});
    if (r.status === 409) return; // 이미 저장된 응답(재시도 중복) → 성공으로 처리
    if (!r.ok) throw new Error(r.status + " " + await r.text());
  } finally { clearTimeout(t); }
}

async function flushQueue(){
  if (!configured()) return;
  let q = loadQueue(); if (!q.length) return;
  const left = [];
  for (const row of q){ try { await post(row); } catch(e){ left.push(row); } }
  saveQueue(left);
}

async function submit(){
  const row = {
    age_group: answers.age_group, companion: answers.companion, booths: answers.booths || [],
    satisfaction: answers.satisfaction, news_awareness: answers.news_awareness, story_learned: answers.story_learned,
    conservation: answers.conservation, syd_awareness: answers.syd_awareness,
    syd_understanding: answers.syd_understanding, revisit: answers.revisit,
    comment: (answers.comment || "").trim() || null,
    client_id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()),
  };
  if (!configured()){ console.log("[데모 모드] 저장될 응답:", row); return; }
  try { await post(row); }
  catch(e){ console.warn("전송 실패, 기기에 보관 후 재시도:", e); const q = loadQueue(); q.push(row); saveQueue(q); }
  flushQueue();
}

window.addEventListener("online", flushQueue);
flushQueue();
draw(false);
</script>
