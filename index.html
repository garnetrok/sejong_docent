<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 금강수목원 숲속문화제 체험부스 만족도 조사</title>

<style>
  :root{
    --bg:#F7F3EA; --card:#FFFDF8; --ink:#24352A; --sub:#5F6B61; --line:#E4DCCB;
    --green:#3E7B4F; --green-soft:#E3EEDC; --warm:#D99A3D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:var(--bg); color:var(--ink); -webkit-tap-highlight-color:transparent;
    word-break:keep-all; line-height:1.5;
  }
  .app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 20px)}
  /* top bar */
  .top{display:flex;align-items:center;gap:12px;height:40px;margin-bottom:8px}
  .back{border:0;background:none;font:inherit;color:var(--sub);font-size:15px;padding:8px 4px;cursor:pointer;visibility:hidden}
  .back.show{visibility:visible}
  .bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .35s ease}
  .count{font-size:13px;color:var(--sub);min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
  .top.hide{visibility:hidden}
  /* screens */
  .screen{flex:1;display:flex;flex-direction:column;animation:in .35s ease both}
  .screen.out{animation:out .18s ease both}
  @keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  @keyframes out{to{opacity:0;transform:translateX(-24px)}}
  .screen.rev{animation-name:inrev}
  @keyframes inrev{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen,.screen.out{animation:none}}
  .art{display:flex;justify-content:center;margin:4px 0 14px}
  .art svg{width:100%;max-width:260px;height:auto}
  .hero svg{max-width:400px}
  .chip{align-self:flex-start;background:var(--green-soft);color:var(--green);font-weight:700;font-size:13px;
    padding:4px 12px;border-radius:99px;margin-bottom:8px}
  h1{font-size:24px;line-height:1.35;font-weight:800;letter-spacing:-.02em}
  h2{font-size:21px;line-height:1.4;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--sub);font-size:15px;margin-top:6px}
  .eyebrow{color:var(--green);font-weight:700;font-size:14px;margin-bottom:6px}
  .lead{font-size:16px;color:var(--ink);margin-top:14px}
  .lead+.lead{margin-top:8px}
  /* options */
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 16px;
    background:var(--card);border:2px solid var(--line);border-radius:16px;
    font:inherit;font-size:17px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;
    transition:border-color .15s,background .15s,transform .1s}
  .opt:active{transform:scale(.98)}
  .opt .emo{font-size:24px;line-height:1}
  .opt .num{width:28px;height:28px;border-radius:50%;background:var(--green-soft);color:var(--green);
    display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
  .opt.on{border-color:var(--green);background:var(--green-soft)}
  .opt.on .num{background:var(--green);color:#fff}
  @media (hover:hover){.opt:hover{border-color:#B9CDB0}}
  /* booth cards */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .card{position:relative;display:flex;flex-direction:column;background:var(--card);border:2px solid var(--line);
    border-radius:18px;padding:10px 10px 12px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;
    transition:border-color .15s,background .15s,transform .1s}
  .card:active{transform:scale(.98)}
  .card svg{width:100%;height:auto;border-radius:12px}
  .card b{font-size:14.5px;line-height:1.35;margin-top:8px;font-weight:700}
  .card small{font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.35}
  .card .tick{position:absolute;top:16px;right:16px;width:26px;height:26px;border-radius:50%;
    background:#fff;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:15px;font-weight:900}
  .card.on{border-color:var(--green);background:var(--green-soft)}
  .card.on .tick{background:var(--green);border-color:var(--green)}
  .card:last-child:nth-child(odd){grid-column:1/-1}
  .card:last-child:nth-child(odd) svg{max-width:58%;align-self:center}
  /* bottom buttons */
  .spacer{flex:1;min-height:20px}
  .btn{display:block;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--green);color:#fff;
    font:inherit;font-size:17px;font-weight:700;cursor:pointer;margin-top:20px;transition:opacity .15s}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.ghost{background:none;color:var(--sub);font-weight:600;margin-top:6px;min-height:48px}
  textarea{width:100%;min-height:130px;margin-top:18px;padding:14px 16px;border:2px solid var(--line);border-radius:16px;
    background:var(--card);font:inherit;font-size:16px;color:var(--ink);resize:vertical}
  textarea:focus{outline:none;border-color:var(--green)}
  .hint{font-size:13px;color:var(--sub);text-align:right;margin-top:6px}
  .sign{margin-top:18px;font-weight:700;color:var(--green)}
  .note{font-size:12px;color:var(--sub);text-align:center;margin-top:10px}
  .center{text-align:center}
</style>
</head>

      <ellipse cx="0" cy="8" rx="15" ry="24" fill="#BF9D72"/>
      <ellipse cx="0" cy="12" rx="9" ry="16" fill="${C.cream}"/>
      <path d="M-13 -30L-11 -42L-3 -34ZM13 -30L11 -42L3 -34Z" fill="#BF9D72"/>
      <circle cx="0" cy="-22" r="15" fill="#BF9D72"/>
      <circle cx="-6" cy="-23" r="4.6" fill="${C.ink}"/><circle cx="6" cy="-23" r="4.6" fill="${C.ink}"/>
      <circle cx="-4.6" cy="-24.6" r="1.5" fill="#fff"/><circle cx="7.4" cy="-24.6" r="1.5" fill="#fff"/>
      <ellipse cx="0" cy="-15.5" rx="2" ry="1.5" fill="${C.b1}"/>
    </g>
    <g transform="translate(34 128) rotate(-120) scale(.75)">
      <rect x="-5" y="-34" width="10" height="56" fill="${C.g2}"/><path d="M-5 22H5L0 34Z" fill="${C.w3}"/><path d="M-2 29H2L0 34Z" fill="${C.g1}"/>
    </g>
    <g transform="translate(170 128) rotate(120) scale(.75)">
      <rect x="-5" y="-34" width="10" height="56" fill="${C.w1}"/><path d="M-5 22H5L0 34Z" fill="${C.w3}"/><path d="M-2 29H2L0 34Z" fill="${C.b2}"/>
    </g>
    ${leaf(30,30,-30,1.3,C.g2)}${leaf(172,28,40,1.3,C.w2)}`, C.g5),
};

/* ---------- 문항 ---------- */
const AGREE = [[5,"매우 그렇다"],[4,"그렇다"],[3,"보통이다"],[2,"그렇지 않다"],[1,"전혀 그렇지 않다"]];
const QUESTIONS = [
  {id:"age_group", type:"single", art:"sprout", title:"어느 연령대이신가요?",
    options:["10대 이하","20대","30대","40대","50대","60대 이상"]},
  {id:"companion", type:"single", art:"feet", title:"오늘 누구와 함께 오셨나요?",
    options:["혼자 왔어요","가족과 함께","친구·연인과 함께","동호회·단체와 함께","기타"]},
  {id:"booths", type:"multi", title:"어떤 숲속 체험을 즐기셨나요?", sub:"해 본 체험을 모두 골라주세요.",
    options:[
      {v:"숲속에 나타난 거대한 사자", d:"낙엽으로 사자 갈기 만들기", art:"lion"},
      {v:"금강수목원을 시민의 숲으로", d:"응원 메시지 현수막", art:"banner"},
      {v:"붓끝에 피어나는 숲", d:"캘리그라피 작품 받기", art:"brush"},
      {v:"9.21초, 다시 시작된 시간", d:"타이머 챌린지", art:"timer"},
      {v:"금강수목원의 숲속 친구들", d:"담비·날다람쥐 색칠", art:"friends"}]},
  {id:"satisfaction", type:"scale", art:"heart", title:"오늘 체험, 얼마나 즐거우셨나요?",
    options:[[5,"최고예요!","😍"],[4,"좋았어요","😊"],[3,"괜찮았어요","🙂"],[2,"조금 아쉬워요","😐"],[1,"많이 아쉬워요","😢"]]},
  {id:"news_awareness", type:"scale", art:"magnify", title:"금강수목원 소식, 어디까지 알고 계셨나요?",
    sub:"오늘 오기 전을 떠올리며 골라주세요.",
    options:[[4,"문을 닫았다가, 시민들의 꾸준한 노력으로 다시 열린 것까지 알았어요","🌳"],
             [3,"문을 닫았던 것까지만 알았어요","🍂"],
             [2,"이름만 들어봤어요","🌱"],
             [1,"오늘 처음 알았어요","👀"]]},
  {id:"story_learned", type:"scale", art:"bubble", title:"오늘 체험으로 금강수목원 이야기를 더 알게 되셨나요?", options:AGREE},
  {id:"conservation", type:"scale", art:"hands", title:"우리의 숲, 더 소중히 지키고 싶어졌나요?",
    sub:"오늘 체험으로 금강수목원을 지켜야겠다는 생각이 더 커졌나요?", options:AGREE},
  {id:"syd_awareness", type:"single", art:"flag", title:"‘세종청년도슨트’를 알고 계셨나요?",
    options:["원래 알고 있었어요!","오늘 처음 알게 됐어요!"]},
  {id:"syd_understanding", type:"scale", art:"bubble", title:"오늘 체험으로 세종청년도슨트가 어떤 활동을 하는지 알게 되셨나요?", options:AGREE},
  {id:"revisit", type:"scale", art:"path", title:"금강수목원에 다시 오고 싶으신가요?",
    options:[[5,"꼭 다시 올래요!"],[4,"오고 싶어요"],[3,"아직 모르겠어요"],[2,"별로 생각 없어요"],[1,"다시 올 생각이 없어요"]]},
  {id:"comment", type:"text", art:"letter", title:"마지막으로 한마디!",
    sub:"오늘 가장 좋았던 점이나 다음에 바라는 점을 알려주세요. (선택)"},
];

/* ---------- 상태 ---------- */
let step = -1;            // -1 = 시작 화면, QUESTIONS.length = 끝 화면
let answers = {};
let busy = false;
const view = document.getElementById("view");
const $top = document.getElementById("top"), $back = document.getElementById("back");
const $bar = document.getElementById("bar"), $count = document.getElementById("count");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function go(next, reverse=false){
  const old = view.firstElementChild;
  const render = () => { step = next; draw(reverse); window.scrollTo(0,0); busy = false; };
  if (old && !matchMedia("(prefers-reduced-motion: reduce)").matches){ old.classList.add("out"); setTimeout(render, 170); }
  else render();
}

function draw(reverse){
  const n = QUESTIONS.length;
  const inQ = step >= 0 && step < n;
  $top.classList.toggle("hide", !inQ);
  $back.classList.toggle("show", step > 0 && inQ);
  if (inQ){ $bar.style.width = ((step)/n*100)+"%"; $count.textContent = `${step+1} / ${n}`; }
  let html = "";
  if (step < 0) html = startHTML();
  else if (step >= n) html = endHTML();
  else html = questionHTML(QUESTIONS[step]);
  view.innerHTML = `<section class="screen${reverse?" rev":""}">${html}</section>`;
  bind();
}

function startHTML(){
  return `
    <div class="art hero">${ART.hero()}</div>
    <p class="eyebrow">2026 금강수목원 숲속문화제 체험부스 만족도 조사</p>
    <h1>오늘 숲속에서<br>어떠셨나요? 🌿</h1>
    <p class="lead">9월 21일, 금강수목원이 다시 문을 열었어요! 이 기쁜 소식을 시민 여러분과 함께 나누려고 세종청년도슨트가 체험부스를 준비했습니다.</p>
    <p class="lead">딱 2분! 답을 누르면 바로 다음 질문으로 넘어가요.</p>
    <div class="spacer"></div>
    <button class="btn" data-act="start">시작하기</button>`;
}

function endHTML(){
  return `
    <div class="art hero">${ART.thanks()}</div>
    <h1 class="center">참여해 주셔서<br>감사합니다! 🌿</h1>
    <p class="lead center">금강수목원에 앞으로도 자주 방문해 주세요!<br>우리 지역의 소중한 이야기를 계속 전하겠습니다.</p>
    <p class="sign center">– 세종청년도슨트</p>
    <div class="spacer"></div>
    ${configured() ? "" : `<p class="note">데모 모드: Supabase 설정 전이라 응답이 저장되지 않았어요.</p>`}
    <button class="btn ghost" data-act="restart">처음으로</button>`;
}

function questionHTML(q){
  const a = answers[q.id];
  let head = `${q.art ? `<div class="art">${ART[q.art]()}</div>` : ""}
    ${q.chip ? `<span class="chip">${q.chip}</span>` : ""}
    <h2>${q.title}</h2>${q.sub ? `<p class="sub">${q.sub}</p>` : ""}`;
  if (q.type === "single"){
    return head + `<div class="opts">${q.options.map(o =>
      `<button class="opt${a===o?" on":""}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  }
  if (q.type === "scale"){
    return head + `<div class="opts">${q.options.map(([v,l,e]) =>
      `<button class="opt${a===v?" on":""}" data-v="${v}">${e?`<span class="emo">${e}</span>`:`<span class="num">${v}</span>`}${esc(l)}</button>`).join("")}</div>`;
  }
  if (q.type === "multi"){
    const sel = a || [];
    return head + `<div class="grid">${q.options.map(o =>
      `<button class="card${sel.includes(o.v)?" on":""}" data-m="${esc(o.v)}" aria-pressed="${sel.includes(o.v)}">
        <span class="tick">✓</span>${ART[o.art]()}<b>${esc(o.v)}</b><small>${esc(o.d)}</small></button>`).join("")}</div>
      <div class="spacer"></div>
      <button class="btn" data-act="next" ${sel.length?"":"disabled"}>다음</button>`;
  }
  if (q.type === "text"){
    return head + `<textarea id="txt" maxlength="500" placeholder="자유롭게 적어주세요">${esc(a||"")}</textarea>
      <p class="hint"><span id="len">${(a||"").length}</span>/500</p>
      <div class="spacer"></div>
      <button class="btn" data-act="submit">제출하기</button>`;
  }
}

function bind(){
  const q = QUESTIONS[step];
  view.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => {
    if (busy) return; busy = true;
    const v = q.type === "scale" ? Number(b.dataset.v) : b.dataset.v;
    answers[q.id] = v;
    view.querySelectorAll(".opt").forEach(x => x.classList.toggle("on", x === b));
    setTimeout(() => go(step+1), 260);
  }));
  view.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => {
    const sel = new Set(answers[q.id] || []);
    sel.has(b.dataset.m) ? sel.delete(b.dataset.m) : sel.add(b.dataset.m);
    answers[q.id] = q.options.map(o => o.v).filter(v => sel.has(v));
    b.classList.toggle("on"); b.setAttribute("aria-pressed", sel.has(b.dataset.m));
    view.querySelector('[data-act="next"]').disabled = sel.size === 0;
  }));
  const txt = document.getElementById("txt");
  if (txt) txt.addEventListener("input", () => { answers.comment = txt.value; document.getElementById("len").textContent = txt.value.length; });
  view.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
    const act = b.dataset.act;
    if (busy) return;
    if (act === "start") { busy = true; go(0); }
    if (act === "next") { busy = true; go(step+1); }
    if (act === "submit") { busy = true; b.disabled = true; b.textContent = "보내는 중…"; submit().finally(() => go(QUESTIONS.length)); }
    if (act === "restart") { answers = {}; busy = true; go(-1); }
  }));
}

$back.addEventListener("click", () => { if (!busy && step > 0){ busy = true; go(step-1, true); } });

/* ---------- 저장 (Supabase REST) ---------- */
const configured = () => !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_KEY.startsWith("YOUR-");
const QUEUE_KEY = "gk_survey_pending";
const loadQueue = () => { try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]"); } catch(e){ return []; } };
const saveQueue = q => { try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch(e){} };

async function post(row){
  const headers = {"Content-Type":"application/json", "apikey":SUPABASE_KEY, "Prefer":"return=minimal"};
  if (SUPABASE_KEY.startsWith("eyJ")) headers["Authorization"] = "Bearer " + SUPABASE_KEY; // 기존 anon(JWT) 키
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 10000);
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {method:"POST", headers, body:JSON.stringify(row), signal:ctrl.signal});
    if (r.status === 409) return; // 이미 저장된 응답(재시도 중복) → 성공으로 처리
    if (!r.ok) throw new Error(r.status + " " + await r.text());
  } finally { clearTimeout(t); }
}

async function flushQueue(){
  if (!configured()) return;
  let q = loadQueue(); if (!q.length) return;
  const left = [];
  for (const row of q){ try { await post(row); } catch(e){ left.push(row); } }
  saveQueue(left);
}

async function submit(){
  const row = {
    age_group: answers.age_group, companion: answers.companion, booths: answers.booths || [],
    satisfaction: answers.satisfaction, news_awareness: answers.news_awareness, story_learned: answers.story_learned,
    conservation: answers.conservation, syd_awareness: answers.syd_awareness,
    syd_understanding: answers.syd_understanding, revisit: answers.revisit,
    comment: (answers.comment || "").trim() || null,
    client_id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()),
  };
  if (!configured()){ console.log("[데모 모드] 저장될 응답:", row); return; }
  try { await post(row); }
  catch(e){ console.warn("전송 실패, 기기에 보관 후 재시도:", e); const q = loadQueue(); q.push(row); saveQueue(q); }
  flushQueue();
}

window.addEventListener("online", flushQueue);
flushQueue();
draw(false);
</script>
